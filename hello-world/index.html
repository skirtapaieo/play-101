<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Welcome 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        .container {
            text-align: center;
            position: relative;
        }
        .screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 1s ease-in-out;
            white-space: nowrap;
        }
        .screen.active {
            opacity: 1;
        }
        h1 {
            font-size: 4rem;
            color: #e94560;
            text-shadow: 0 0 10px #e94560, 0 0 20px #e94560, 0 0 40px #e94560;
            animation: glow 2s ease-in-out infinite alternate;
        }
        .screen2 h1 {
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff, 0 0 40px #00d4ff;
        }
        .screen2 h2 {
            font-size: 2rem;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
            margin-top: 1rem;
        }
        @keyframes glow {
            from {
                filter: brightness(1);
            }
            to {
                filter: brightness(1.3);
            }
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="container">
        <div class="screen screen1 active">
            <h1>Hello World!</h1>
        </div>
        <div class="screen screen2">
            <h1>Welcome to 2026</h1>
            <h2>Happy New Year!</h2>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 100;
        let currentScreen = 1;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.baseHue = currentScreen === 1 ? 340 : 190;
                this.color = `hsl(${Math.random() * 60 + this.baseHue}, 100%, 60%)`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            updateColor() {
                this.baseHue = currentScreen === 1 ? 340 : 190;
                this.color = `hsl(${Math.random() * 60 + this.baseHue}, 100%, 60%)`;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(26, 26, 46, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Screen transition every 10 seconds
        function switchScreen() {
            const screen1 = document.querySelector('.screen1');
            const screen2 = document.querySelector('.screen2');

            if (currentScreen === 1) {
                screen1.classList.remove('active');
                screen2.classList.add('active');
                currentScreen = 2;
            } else {
                screen2.classList.remove('active');
                screen1.classList.add('active');
                currentScreen = 1;
            }

            // Update particle colors
            particles.forEach(p => p.updateColor());
        }

        setInterval(switchScreen, 10000);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
